name: promptfoo-sofia

# Promptfoo da Sofia em produção: roda o banco de conversas douradas (backend/src/eval/banco.ts) contra a
# Sofia que ESTÁ NO AR e manda o resultado para o Telegram do João. Relatório HTML fica como artefato.
#
# "No ar" quer dizer: a MESMA imagem e o MESMO ambiente do contêiner do serviço (copiado de `docker inspect`,
# então chaves como CAPTURA_UNIFICADA_SLUGS valem igual), num contêiner à parte que não toca no que atende
# paciente. Trocas: DATABASE_URL aponta para o IP do banco na docker_gwbridge (a rede do Swarm não aceita
# contêiner avulso), KOMMO_ACCESS_TOKEN vai FALSO (o eval nunca chama o Kommo; se chamar, quebra) e TELEGRAM_* fica fora.
# Roda no runner da própria VPS (o mesmo do deploy): nenhum segredo novo no GitHub.

on:
  schedule:
    - cron: '0 9 * * *' # 06:00 em Brasília, antes do movimento
  workflow_dispatch:
    inputs:
      caso:
        description: 'Só este caso (id do banco.ts). Vazio = todos.'
        required: false
        default: ''
      unidade:
        description: 'Só os casos desta unidade (slug). Vazio = todas.'
        required: false
        default: ''
      repeticoes:
        description: 'Quantas voltas (3 pega caso instável).'
        required: false
        default: '1'

concurrency:
  group: promptfoo-sofia
  cancel-in-progress: false

jobs:
  eval:
    runs-on: [self-hosted, linux, vps]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REMOTE_DIR: /opt/doutordigital/agente-dt
      PF_CASO: ${{ inputs.caso }}
      PF_UNIDADE: ${{ inputs.unidade }}
      REPETICOES: ${{ inputs.repeticoes || '1' }}
      LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PF_VERSAO: promptfoo@0.125.1
      NOME: pf-sofia-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Rodar o banco dourado contra a Sofia no ar
        id: eval
        run: |
          set -eu
          # a pasta de saída vem primeiro: se algo abaixo falhar, o passo do Telegram ainda avisa
          OUT="$RUNNER_TEMP/promptfoo"
          mkdir -p "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          # o arquivo de ambiente tem segredo: sai do disco aconteça o que acontecer
          trap 'rm -f "$OUT/env"' EXIT
          case "$REPETICOES" in ''|*[!0-9]*|0) echo "repeticoes inválido (inteiro ≥ 1)"; exit 1 ;; esac

          AG=$(docker ps -qf name=ddagent_agent | head -1)
          [ -n "$AG" ] || { echo "contêiner da Sofia não encontrado"; exit 1; }
          IMG=$(docker inspect -f '{{.Config.Image}}' "$AG")
          echo "imagem=$IMG" >> "$GITHUB_OUTPUT"
          DB=$(docker ps -qf name=ddagentdb_db | head -1)
          [ -n "$DB" ] || { echo "contêiner do banco não encontrado"; exit 1; }
          IP=$(docker network inspect docker_gwbridge -f '{{range $k,$v := .Containers}}{{$k}} {{$v.IPv4Address}}{{println}}{{end}}' \
            | awk -v c="$DB" 'index($1,c)==1 {split($2,a,"/"); print a[1]}')
          case "$IP" in ''|*[!0-9.]*) echo "IP do banco na docker_gwbridge inválido: '$IP'"; exit 1 ;; esac

          # ambiente = o do contêiner da Sofia no ar, com as trocas do cabeçalho
          umask 077
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$AG" > "$OUT/env.bruto"
          URL_SERVICO=$(grep -m1 '^DATABASE_URL=' "$OUT/env.bruto" | cut -d= -f2-)
          URL=$(printf '%s' "$URL_SERVICO" | sed "s#@ddagentdb_db:5432/#@${IP}:5432/#")
          echo "::add-mask::$URL_SERVICO"
          echo "::add-mask::$URL"
          [ -n "$URL" ] && [ "$URL" != "$URL_SERVICO" ] || { rm -f "$OUT/env.bruto"; echo "não consegui trocar o host do banco na DATABASE_URL"; exit 1; }
          grep -vE '^(DATABASE_URL|KOMMO_ACCESS_TOKEN|LOG_LEVEL|TELEGRAM_[A-Z_]*)=' "$OUT/env.bruto" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' > "$OUT/env"
          rm -f "$OUT/env.bruto"
          {
            echo "DATABASE_URL=$URL"
            echo "KOMMO_ACCESS_TOKEN=eval-nunca-chama-o-kommo"
            echo "LOG_LEVEL=warn"
            echo "PROMPTFOO_DISABLE_TELEMETRY=1"
            echo "PROMPTFOO_DISABLE_SHARING=1"
            echo "PROMPTFOO_DISABLE_UPDATE=1"
            echo "PROMPTFOO_DISABLE_REMOTE_GENERATION=1"
            echo "PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION=1"
          } >> "$OUT/env"

          # baixa o Promptfoo SEM nenhum segredo no ambiente (scripts de instalação de 600 pacotes não veem a senha);
          # a rodada de verdade usa o que ficou no cache
          docker run --rm --memory 1g -v promptfoo-npm:/root/.npm "$IMG" npx -y "$PF_VERSAO" --version </dev/null

          set +e
          docker run --rm --name "$NOME" --memory 1g --network host \
            -v "$OUT":/out -v promptfoo-npm:/root/.npm -v promptfoo-historico:/root/.promptfoo \
            -w /repo/backend --env-file "$OUT/env" -e PF_CASO -e PF_UNIDADE -e REPETICOES -e PF_VERSAO \
            "$IMG" sh -c 'npx -y "$PF_VERSAO" eval -c promptfoo/promptfooconfig.yaml --no-cache --repeat "$REPETICOES" -o /out/resultado.json /out/relatorio.html' \
            </dev/null > "$OUT/log.txt" 2>&1
          CODIGO=$?
          set -e
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          tail -20 "$OUT/log.txt"

      - name: Resumo e aviso no Telegram
        if: always() && steps.eval.outputs.out != ''
        run: |
          set -u
          set -a; . "$REMOTE_DIR/.env"; set +a
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          OUT="${{ steps.eval.outputs.out }}"
          IMG="${{ steps.eval.outputs.imagem }}"
          CODIGO="${{ steps.eval.outputs.codigo }}"
          RESUMO="$GITHUB_WORKSPACE/backend/promptfoo/resumo.mjs"
          OK=0
          if [ -n "$IMG" ] && [ -s "$OUT/resultado.json" ]; then
            docker run --rm -v "$OUT":/out -v "$RESUMO":/resumo.mjs:ro "$IMG" node /resumo.mjs /out/resultado.json markdown >> "$GITHUB_STEP_SUMMARY" \
              && docker run --rm -v "$OUT":/out -v "$RESUMO":/resumo.mjs:ro "$IMG" node /resumo.mjs /out/resultado.json telegram "$LINK" > "$OUT/telegram.txt" \
              && OK=1
          fi
          if [ "$OK" != 1 ]; then
            printf '🧪 Sofia — Promptfoo diário: ❌ a rodada NÃO aconteceu direito (código %s). Log: %s\n' "${CODIGO:-?}" "$LINK" > "$OUT/telegram.txt"
            echo "A rodada não gerou resultado utilizável (código ${CODIGO:-?})." >> "$GITHUB_STEP_SUMMARY"
          fi
          # --fail: Telegram respondendo 400/401 deixa este passo vermelho em vez de sumir com o aviso
          curl -sS --fail -o /dev/null -w 'telegram: %{http_code}\n' "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_JOAO}" --data-urlencode "text@$OUT/telegram.txt" \
            --data-urlencode "disable_web_page_preview=true"

      - name: Guardar o relatório
        if: always() && steps.eval.outputs.out != ''
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-sofia-${{ github.run_id }}
          path: |
            ${{ steps.eval.outputs.out }}/relatorio.html
            ${{ steps.eval.outputs.out }}/resultado.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Limpar e sair com o resultado
        if: always() && steps.eval.outputs.out != ''
        run: |
          docker rm -f "$NOME" >/dev/null 2>&1 || true
          rm -rf "${{ steps.eval.outputs.out }}" || true
          # 0 = todos passaram; 100 = algum caso reprovou (rodou): vermelho e o GitHub avisa por e-mail
          [ "${{ steps.eval.outputs.codigo }}" = "0" ]
