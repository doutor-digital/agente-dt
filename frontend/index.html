<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Tema claro/escuro sem flash: aplica a classe antes de qualquer paint.
         Default = claro; respeita a escolha salva em localStorage. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agente DT — Kommo Automation Console</title>
    <meta name="description" content="Console de observabilidade do agente de automação Kommo." />
    <!-- Fonte Google: PT Sans (mesma fonte do Kommo) — só 400 e 700 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <!-- Logo: preconnect + preload pra evitar flash na sidebar -->
    <link rel="preconnect" href="https://i.postimg.cc" crossorigin />
    <link rel="preload" as="image" href="https://i.postimg.cc/9fkz8kVx/DESIGN-(1).png" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
