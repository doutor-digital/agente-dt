<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Tema sem flash: aplica a classe antes de qualquer paint.
         Default = escuro (o console é dark-first); respeita a escolha salva. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agente DT — Console</title>
    <meta
      name="description"
      content="Console de operação e observabilidade dos agentes de IA da Doutor Digital."
    />
    <meta name="theme-color" content="#0a0b0c" />

    <!-- Inter variable — a fonte de UI dos consoles modernos. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="/logo-dd.png" />
    <link rel="preload" as="image" href="/logo-dd.png" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
