<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ponte</title>
    <link rel="stylesheet" href="painel.css" />
  </head>
  <body>
    <header class="topo">
      <span class="topo__marca">Ponte</span>
      <span class="topo__unidade" id="unidade"></span>
    </header>
    <nav class="abas" role="tablist" aria-label="Seções da Ponte">
      <button type="button" class="abas__botao" id="aba-conversa" role="tab" aria-selected="true" aria-controls="conteudo">Conversa</button>
      <button type="button" class="abas__botao" id="aba-fila" role="tab" aria-selected="false" aria-controls="fila">Fila de hoje</button>
    </nav>
    <main id="conteudo" role="tabpanel" aria-live="polite"></main>
    <section id="fila" class="painel-fila" role="tabpanel" aria-live="polite" hidden></section>
    <div id="aprendiz"></div>
    <footer class="rodape">A Ponte nunca escreve no WhatsApp. No Kommo, só pausa e retoma a Sofia quando você pede.</footer>
    <script src="config.js"></script>
    <script src="pausa.js"></script>
    <script src="desenho.js"></script>
    <script src="aprendiz.js"></script>
    <script src="painel.js"></script>
  </body>
</html>
